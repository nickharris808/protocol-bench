[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "protocol-bench"
version = "1.1.1"
description = "Ground-truth safety verdicts for 15 published IEEE 802.11 and 3GPP procedures, with machine-validated counterexamples."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["benchmark", "protocol-verification", "model-checking", "ieee-802-11", "3gpp", "krack", "llm-evaluation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Software Development :: Testing",
]
# minicheck is not on PyPI yet, so a bare `minicheck>=0.2.0` makes this package
# UNINSTALLABLE for anyone who has not already installed it by hand — pip resolves the
# name against PyPI and 404s. A PEP 508 direct reference resolves without an index, so
# `pip install .` and `pip install <this>@git+...` both work today for a stranger.
#
# Swap it back to a plain `minicheck>=0.2.0` when publishing to PyPI (PyPI rejects direct
# references on upload). `python build_pypi.py` does that swap and builds the artifact.
dependencies = ["minicheck @ git+https://github.com/nickharris808/minicheck@main"]

[project.urls]
Homepage = "https://github.com/nickharris808/protocol-bench"
Documentation = "https://nickharris808.github.io/verification-docs/"
Repository = "https://github.com/nickharris808/protocol-bench"
Issues = "https://github.com/nickharris808/protocol-bench/issues"

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
protocol-bench = "protocol_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
protocol_bench = ["data/*.json"]

[tool.pytest.ini_options]
markers = ["network: reaches PyPI; skipped offline, and a skip is never a pass"]
testpaths = ["tests"]
